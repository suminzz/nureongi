<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
  /* 굴러가는 것처럼 보이게 계속 돈다. 방향과 빠르기는 본체가 창 주소(#)로 알려 준다 */
  #ball { transform-origin: 20px 20px; animation: spin .5s linear infinite; }
  body.left #ball { animation-direction: reverse; }
  body.still #ball { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="still">
  <svg viewBox="0 0 40 40">
    <g id="ball">
      <circle cx="20" cy="20" r="14" fill="#d7e85a" stroke="#8fa531" stroke-width="2"/>
      <path d="M9 13 C16 16 16 24 9 27" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M31 13 C24 16 24 24 31 27" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </svg>
  <script src="ball.js"></script>
</body>
</html>
